# Controlled local Lab only: no published ports, host network, Docker socket or host logs.
services:
  target:
    image: zhiyu-m6-sensor-lab:preflight
    build: ./lab/real-sensors
    networks:
      lab:
        ipv4_address: 10.89.60.10
    volumes: ["lab_logs:/lab-logs"]
    tmpfs: ["/tmp"]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  client:
    image: zhiyu-m6-sensor-lab:preflight
    command: ["python", "client.py"]
    profiles: [traffic]
    networks:
      lab:
        ipv4_address: 10.89.60.20
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
  suricata:
    image: zhiyu-m6-sensor-lab:preflight
    network_mode: service:target
    command: ["python", "suricata_start.py"]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    volumes:
      - ./lab/real-sensors/lab.rules:/lab.rules:ro
      - suricata_logs:/var/log/suricata
    depends_on:
      target:
        condition: service_healthy
    mem_limit: 512m
    cpus: 2
  wazuh-manager:
    image: zhiyu-m6-wazuh-manager:4.14.7
    build:
      context: ./lab/real-sensors
      dockerfile: Dockerfile.wazuh-manager
    hostname: zhiyu-lab-manager
    networks: [lab]
    volumes:
      - ./lab/real-sensors/wazuh-manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - ./lab/real-sensors/wazuh-rules.xml:/wazuh-config-mount/etc/rules/zhiyu_lab.xml:ro
      - wazuh_logs:/var/ossec/logs
      - wazuh_etc:/var/ossec/etc
      - wazuh_queue:/var/ossec/queue
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running'"]
      interval: 5s
      timeout: 5s
      retries: 60
  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.7@sha256:6a61eac6b6d55b0bb59c85b3d33f7859c60b4ef9e81475f890d2de8a097122c7
    hostname: zhiyu-lab-target-agent
    environment:
      WAZUH_MANAGER_SERVER: wazuh-manager
      WAZUH_AGENT_NAME: zhiyu-lab-target-agent
    networks: [lab]
    volumes:
      - ./lab/real-sensors/wazuh-agent.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - lab_logs:/lab-logs:ro
      - wazuh_agent_etc:/var/ossec/etc
    depends_on:
      wazuh-manager:
        condition: service_healthy
      target:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1
  postgres:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: zhiyu
      POSTGRES_USER: zhiyu
      POSTGRES_HOST_AUTH_METHOD: trust
    networks: [control]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zhiyu", "-d", "zhiyu"]
      interval: 3s
      timeout: 2s
      retries: 30
    mem_limit: 512m
  runner:
    image: zhiyu-smoke-a6edef3fbf39-tests:latest
    profiles: [validation]
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/src:/workspace/tools
      ZHIYU_DATABASE_URL: postgresql+psycopg://zhiyu@postgres:5432/zhiyu
    networks:
      control: {}
      lab:
        ipv4_address: 10.89.60.30
    volumes:
      - .:/workspace:ro
      - suricata_logs:/sensor-evidence/suricata:ro
      - wazuh_logs:/sensor-evidence/wazuh:ro
      - lab_logs:/sensor-evidence/app:ro
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres:
        condition: service_healthy
networks:
  lab:
    internal: true
    ipam:
      config: [{subnet: 10.89.60.0/24}]
  control:
    internal: true
volumes:
  lab_logs:
  suricata_logs:
  wazuh_logs:
  wazuh_etc:
  wazuh_queue:
  wazuh_agent_etc:
  postgres_data:
