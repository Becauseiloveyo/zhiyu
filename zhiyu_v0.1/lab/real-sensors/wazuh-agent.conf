<ossec_config>
  <client>
    <server><address>CHANGE_MANAGER_IP</address><port>CHANGE_MANAGER_PORT</port><protocol>tcp</protocol></server>
    <notify_time>5</notify_time><time-reconnect>10</time-reconnect><auto_restart>yes</auto_restart>
    <enrollment>
      <enabled>yes</enabled><manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port><agent_name>CHANGE_AGENT_NAME</agent_name><groups>default</groups>
    </enrollment>
  </client>
  <localfile><log_format>json</log_format><location>/lab-logs/auth.json</location></localfile>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <syscheck><disabled>yes</disabled></syscheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <active-response><disabled>yes</disabled></active-response>
  <logging><log_format>plain</log_format></logging>
</ossec_config>
